# Cloudflare config for Luis's PERSONAL account only.
#
# account_id pins every wrangler command run in this folder to that account.
# Cloudflare Pages does not accept account_id in a Pages config file, so this file
# deliberately has no pages_build_output_dir: scripts/deploy.sh passes the folder and
# project name itself, exports CLOUDFLARE_ACCOUNT_ID with the same ID, and refuses to
# deploy if wrangler is signed in to any other account.
name = "luistanafranca"
